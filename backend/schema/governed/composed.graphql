directive @geoPoint(shape: GeoPointShape!) on FIELD_DEFINITION

directive @reference(
  uri: String!
) on FIELD_DEFINITION | OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR | ENUM_VALUE

directive @range(min: Float, max: Float) on FIELD_DEFINITION

type ChargingStation {
  id: ID!
  name: String!
  operator: String!
  stationCode: String!
  location: GeoJSON! @geoPoint(shape: POINT)
  address: Address
  availability: StationAvailability!
  chargingPoints: [ChargingPointInfo!]!
}

type StationAvailability {
  totalPoints: Int!
  availableNowPoints: Int!
  operationalPoints: Int!
}


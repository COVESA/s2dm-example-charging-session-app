type Vehicle {
  id: ID!
  vin: String!
  make: String!
  model: String!
  year: Int! @range(min: 1886)
  batteryCapacityKwh(unit: EnergyUnit = KILOW_HR): Float!
  maxChargePowerKw(unit: ElectricPowerUnit = KILOW): Float!
  connectorTypes: [ConnectorType!]!
}


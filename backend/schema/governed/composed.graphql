type ChargingPointInfo {
  id: ID!
  availableNow: Boolean!
  outOfService: Boolean!
  connectors: [ConnectorInfo!]!
}

type ChargingSession {
  id: ID!
  vehicleId: ID!
  stationId: ID!
  chargingPointId: ID!
  status: SessionStatus!
  booking: SessionBooking!
  charging: ChargingDetails!
  createdAt: String!
  updatedAt: String!
}

"""
A GeoJSON object as defined by RFC 7946.
"""
scalar GeoJSON
  @specifiedBy(
    url: "https://the-guild.dev/graphql/scalars/docs/scalars/geo-json"
  )

type SessionBooking {
  bookedAt: String!
  expiresAt: String!
  canceledAt: String
  cancelReason: String
}

type SessionConnectorUsed {
  type: ConnectorType
  power: Float
  tethered: Boolean
}

enum SessionStatus {
  BOOKED
  ACTIVE
  COMPLETED
  CANCELED
  NO_SHOW
  FAILED
}

enum ConnectorType {
  CCS
  CHAdeMO
  SCHUKO
  TYPE1
  TYPE2
}

enum IncidentSeverity {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

enum IncidentStatus {
  OPEN
  ACKNOWLEDGED
  RESOLVED
}

enum IncidentType {
  USER_REPORT
  NO_HEARTBEAT
  CONNECTOR_FAULT
  POWER_DERATE
  MAINTENANCE
}

type Address {
  street: String
  city: String
  postalCode: String
  country: String
}

type ChargingDetails {
  startedAt: String
  endedAt: String
  connectorUsed: SessionConnectorUsed
  meterStart(unit: EnergyUnit = W_HR): Float
  meterStop(unit: EnergyUnit = W_HR): Float
  energyDeliveredKwh(unit: EnergyUnit = KILOW_HR): Float
  socStartPercent(unit: DimensionlessRatioUnit = PERCENT): Int
  socStopPercent(unit: DimensionlessRatioUnit = PERCENT): Int
}

type ConnectorInfo {
  type: ConnectorType!
  powerKw(unit: ElectricPowerUnit = KILOW): Float!
  tethered: Boolean
}

type Query {
  ping: String
}
